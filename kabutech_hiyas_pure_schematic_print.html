    <line x1="1360" y1="1570" x2="2775" y2="1570" stroke="#7A896F" stroke-width="1.0" />
    <text x="1375" y="1592" class="text-desc" style="font-weight:bold;">MANDATORY HARDWARE PROTECTION STANDARDS:</text>
    <text x="1375" y="1610" class="text-desc">1. Inductive Flyback: Fast 1N4007 recovery diodes MUST be placed across all 12V relay coils, fans, pump motor, and solenoid valve.</text>
    <text x="1375" y="1628" class="text-desc">2. Anti-Corrosion Strobe: Resistive water level sensor power pin (IO8) is energized ONLY during 15ms sampling cycles to prevent electrolysis.</text>
    <text x="1375" y="1646" class="text-desc">3. Thermal Isolation: MQ-135 5V internal heater coil must maintain at least 10cm separation from DHT11/SHT31 to prevent radiant heat bias.</text>
